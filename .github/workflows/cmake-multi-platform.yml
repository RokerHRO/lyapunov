name: CMake on multiple platforms

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            generator: "Unix Makefiles"
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            generator: "Unix Makefiles"
          - os: windows-latest
            c_compiler: gcc
            cpp_compiler: g++
            generator: Ninja

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMP for Clang
        if: matrix.os == 'ubuntu-latest' && matrix.c_compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev

      - name: Set up MSYS2 MinGW
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure CMake (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: >
          cmake -B build
          -G "${{ matrix.generator }}"
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -S .

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        shell: 'msys2 {0}'
        run: >
          cmake -B build
          -G "${{ matrix.generator }}"
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -S .

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: cmake --build build --config Release

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: 'msys2 {0}'
        run: cmake --build build --config Release

      - name: Test (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ctest --test-dir build --build-config Release

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: 'msys2 {0}'
        run: ctest --test-dir build --build-config Release
